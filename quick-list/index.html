<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras da Semana | Quicklist</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>
    <div class="app-container">
        <div class="logo">quicklist</div>

        <header class="header">
            <button class="back-button" aria-label="Voltar para a página anterior">
                &larr; Voltar
            </button>
            <h1 class="title">Compras da semana</h1>
        </header>

        <section class="add-item-form-section">
            <form id="addItemForm" class="add-item-form">
                <input type="text" id="itemInput" class="item-input" placeholder="Adicione um novo item" required
                    aria-label="Adicionar novo item à lista" maxlength="100">
                <button type="submit" class="add-item-button">
                    Adicionar item
                </button>
            </form>
        </section>

        <ul id="shoppingList" class="shopping-list">
        </ul>
    </div>

    <div id="alertContainer" class="alert-container" aria-live="polite"></div>
</body>

</html>
