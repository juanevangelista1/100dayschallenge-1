<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras da Semana | Lista de Compras</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>
    <div class="aap-container">
        <header class="header">
            <a href="/">
                <img src="./assets/logo-svg.svg" alt="Logo">
            </a>
        </header>
        <section class="title-section">
            <button class="back-button">&larr; Voltar</button>
            <h1 class="title">Compras da semana</h1>
        </section>

        <section class="add-item-form-section">
            <form id="addItemForm" class="add-item-form">
                <input type="text" id="itemInput" placeholder="Adicionar item">
                <button type="submit">Adicionar Item</button>
            </form>
            <div id="alertContainer" class="alert-container" aria-live="polite"></div>
        </section>

        <section class="item-list-section">
            <ul id="shoppingList" class="item-list"></ul>
        </section>
    </div>
</body>

</html>
